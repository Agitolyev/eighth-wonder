name: Update fund data

# Refreshes objective per-fund figures (certificate/unit price) daily from the
# funds' official offer pages, ONE JOB PER FUND. Running per fund means a
# blocked/failed source only marks its own job failed (not the others), and the
# Actions UI shows exactly which fund's price is going stale.
#
# scripts/update-funds.mjs --fund <id> updates that fund's row in
# assets/data/funds.csv (source of truth) and regenerates assets/js/funds-live.js
# (what the page loads). Projected returns are NOT touched — they stay curated
# in assets/js/data.js. Deploy to GitHub Pages republishes on its own schedule.
on:
  # 06:30 UTC daily — just after the FX job, before the 07:00 Pages redeploy.
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialize all runs of this workflow so per-fund commits never race on push.
concurrency:
  group: update-funds
  cancel-in-progress: false

jobs:
  # Read the fund ids straight from the CSV so the matrix stays in sync with the
  # data (no hard-coded fund list in this file).
  discover:
    runs-on: ubuntu-latest
    outputs:
      funds: ${{ steps.list.outputs.funds }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        run: |
          funds=$(node -e "const fs=require('fs');const ids=fs.readFileSync('assets/data/funds.csv','utf8').trim().split('\n').slice(1).map(l=>l.split(',')[0]).filter(Boolean);process.stdout.write(JSON.stringify(ids))")
          echo "funds=$funds" >> "$GITHUB_OUTPUT"
          echo "Funds: $funds"

  update:
    needs: discover
    runs-on: ubuntu-latest
    # One job per fund. Independent statuses; a failing source doesn't fail the
    # others. max-parallel: 1 keeps the per-fund commits from racing on push.
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        fund: ${{ fromJson(needs.discover.outputs.funds) }}
    name: ${{ matrix.fund }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch ${{ matrix.fund }}
        # Exits non-zero if this fund can't be refreshed (its job is then marked
        # failed), but writes the fallback (last-known) value to the files first.
        run: node scripts/update-funds.mjs --fund ${{ matrix.fund }}

      - name: Commit ${{ matrix.fund }}
        # Runs even if the fetch failed; commits only when this fund's value
        # actually changed. This fund's job status stays failed on failure.
        if: always()
        run: |
          if [[ -z "$(git status --porcelain assets/data/funds.csv assets/js/funds-live.js)" ]]; then
            echo "No change for ${{ matrix.fund }}."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git add assets/data/funds.csv assets/js/funds-live.js
          git commit -m "chore: update ${{ matrix.fund }} price ($(date -u +%Y-%m-%d))"
          git push
