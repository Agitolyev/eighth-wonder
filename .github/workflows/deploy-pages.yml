name: Deploy to GitHub Pages

# Deploys the static site (repository root) to GitHub Pages.
# The Configure Pages step enables Pages (GitHub Actions source) on first run,
# so no manual repo Settings → Pages change is required.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Enable Pages (GitHub Actions source) if it isn't already, instead
          # of failing with "Get Pages site failed ... Not Found".
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Whole repo root is the site; static HTML/CSS/JS.
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
