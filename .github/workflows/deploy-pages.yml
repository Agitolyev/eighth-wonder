name: Deploy to GitHub Pages

# Deploys the static site (repository root) to GitHub Pages.
#
# One-time setup (required before the first run): in the repository,
# open Settings → Pages → Build and deployment → Source and choose
# "GitHub Actions". This creates the Pages site.
#
# We deliberately do NOT set `enablement: true` on the Configure Pages
# step. Creating a Pages site through the API needs admin-level access
# that the workflow's built-in GITHUB_TOKEN does not have, so it fails
# with "Create Pages site failed. Error: Resource not accessible by
# integration" and takes the whole job down with it. Enabling Pages once
# from Settings (above) is the supported way to bootstrap the site.
on:
  push:
    branches: [main]
  # Republish daily so the site picks up the fresh conversion rates committed
  # by the "Update FX rates" workflow (which runs at 06:20 UTC). A push made by
  # that job's built-in GITHUB_TOKEN can't trigger this workflow, so we rerun
  # it on a schedule instead.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Whole repo root is the site; static HTML/CSS/JS.
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
